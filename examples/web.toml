# A bridged, port-published, resource-limited container.
#   sudo myrun run --config examples/web.toml -d --name web

rootfs    = "/tmp/myrun-rootfs"
command   = ["/bin/sh", "-c", "while true; do echo serving; sleep 5; done"]
hostname  = "web"
cwd       = "/"
read_only = true

env = ["APP_ENV=production", "LOG_LEVEL=info"]

[resources]
memory = "256m"
cpus   = 1.5
pids   = 64

[network]
mode = "bridge"
dns  = ["1.1.1.1", "8.8.8.8"]

[[network.publish]]
host      = 8080
container = 80

[security]
seccomp  = "default"
cap_drop = ["all"]
cap_add  = ["NET_BIND_SERVICE"]
